<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      font-family: 'Georgia', 'Times New Roman', serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Book Container ───────────────────────────────────────── */
    .book-wrap {
      position: relative;
      width: min(380px, 94vw);
      height: min(620px, 90dvh);
      perspective: 1800px;
    }

    /* ── Page ─────────────────────────────────────────────────── */
    .page {
      position: absolute;
      inset: 0;
      border-radius: 4px 16px 16px 4px;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.75s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      cursor: pointer;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    /* Stack pages so the current is on top */
    .page { z-index: 0; }
    .page.active       { z-index: 10; }
    .page.active.flipped { z-index: 5; }

    /* ── Page faces ───────────────────────────────────────────── */
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .face-front {
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 4px 0 20px rgba(0,0,0,0.6), inset -3px 0 8px rgba(0,0,0,0.4);
    }

    .face-back {
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: -4px 0 20px rgba(0,0,0,0.6), inset 3px 0 8px rgba(0,0,0,0.4);
      transform: rotateY(180deg);
    }

    /* page-edge crease */
    .face-front::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 6px;
      background: linear-gradient(to right, transparent, rgba(0,0,0,0.25));
      border-radius: 0 16px 16px 0;
      pointer-events: none;
    }

    /* ── Cover page ───────────────────────────────────────────── */
    .cover-face {
      background: linear-gradient(155deg, #1b1b35 0%, #0d2137 50%, #041426 100%);
      justify-content: center;
      gap: 18px;
      padding: 30px 24px;
    }

    .cover-face .cover-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0,180,255,0.4));
    }

    .cover-face .cover-title {
      font-size: 1.65rem;
      font-weight: 700;
      color: #e8c870;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .cover-face .cover-sub {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .cover-face .cover-divider {
      width: 70%;
      height: 1px;
      background: linear-gradient(to right, transparent, #e8c870, transparent);
    }

    .cover-face .cover-tagline {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      text-align: center;
      font-style: italic;
      line-height: 1.6;
      padding: 0 10px;
    }

    .cover-face .cover-hint {
      position: absolute;
      bottom: 22px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cover-hint .arrow-icon {
      width: 18px;
      opacity: 0.5;
      animation: nudge 1.6s ease-in-out infinite;
    }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(5px); }
    }

    /* ── Hero page layout ─────────────────────────────────────── */
    .hero-face {
      padding: 0;
    }

    /* Top ribbon */
    .hero-ribbon {
      width: 100%;
      background: linear-gradient(90deg, #8b0000 0%, #c0392b 100%);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .ribbon-badge {
      font-size: 0.6rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .ribbon-serial {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.1em;
    }

    /* Photo area */
    .hero-photo-wrap {
      width: 100%;
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px 10px;
    }

    .hero-photo-frame {
      width: 155px;
      height: 175px;
      border-radius: 6px;
      border: 3px solid #e8c870;
      box-shadow: 0 0 0 1px rgba(232,200,112,0.3), 0 8px 30px rgba(0,0,0,0.7);
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .hero-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Candlelight overlay on photo */
    .hero-photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
    }

    /* Info section */
    .hero-info {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 20px 16px;
      gap: 0;
    }

    .hero-name {
      font-size: 1rem;
      font-weight: 700;
      color: #e8c870;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.3;
      margin-bottom: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .hero-service-no {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero-divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(232,200,112,0.5), transparent);
      margin-bottom: 14px;
    }

    .hero-detail-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
    }

    .detail-label {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: 'Arial', sans-serif;
    }

    .detail-value {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.88);
      line-height: 1.35;
      font-family: 'Georgia', serif;
    }

    /* Flame / candle footer */
    .hero-footer {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 14px;
      gap: 5px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .flame-wrap {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .candle-flame {
      width: 10px;
      height: 14px;
      background: radial-gradient(ellipse at 50% 80%, #fff5b0 0%, #ffb347 40%, #e25822 80%, transparent 100%);
      border-radius: 50% 50% 30% 30%;
      animation: flicker 1.2s ease-in-out infinite alternate;
      filter: blur(0.4px);
    }

    .candle-flame.small {
      width: 7px;
      height: 10px;
      animation-delay: 0.3s;
    }

    @keyframes flicker {
      0%   { transform: scaleX(1)   scaleY(1)    skewX(0deg); opacity: 1; }
      33%  { transform: scaleX(0.9) scaleY(1.05) skewX(-2deg); opacity: 0.95; }
      66%  { transform: scaleX(1.1) scaleY(0.97) skewX(2deg);  opacity: 0.9; }
      100% { transform: scaleX(0.95)scaleY(1.03) skewX(-1deg); opacity: 1; }
    }

    .candle-body {
      width: 10px;
      height: 24px;
      background: linear-gradient(to right, #f0e0c0, #fffaf0, #d4b896);
      border-radius: 2px 2px 0 0;
    }

    .candle-body.small {
      width: 7px;
      height: 18px;
    }

    .hero-rip {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Arial', sans-serif;
    }

    /* ── Navigation controls ──────────────────────────────────── */
    .nav-bar {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .nav-btn:hover  { background: rgba(255,255,255,0.14); }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    .nav-btn svg { width: 18px; height: 18px; fill: rgba(255,255,255,0.75); }

    .page-counter {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      min-width: 60px;
      text-align: center;
      font-family: 'Arial', sans-serif;
    }

    /* ── End page ─────────────────────────────────────────────── */
    .end-face {
      justify-content: center;
      gap: 16px;
      padding: 30px 24px;
      text-align: center;
    }

    .end-face .end-icon { font-size: 2.5rem; }

    .end-face .end-title {
      font-size: 1rem;
      color: #e8c870;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .end-face .end-text {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.7;
      font-style: italic;
    }

    /* ── Touch / swipe hint ───────────────────────────────────── */
    .swipe-hint {
      position: absolute;
      bottom: -34px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>

  // ── Helpers ────────────────────────────────────────────────────
  function heroPhotoSrc(serial) {
    return `images/heroes/${serial}.jpg`;
  }

  function makeFlamePair() {
    return `
      <div class="flame-wrap">
        <div class="candle"><div class="candle-flame small"></div><div class="candle-body small"></div></div>
        <div class="candle"><div class="candle-flame"></div><div class="candle-body"></div></div>
        <div class="candle"><div class="candle-flame small"></div><div class="candle-body small"></div></div>
      </div>`;
  }

  // ── Build pages array ──────────────────────────────────────────
  // Pages: [cover, hero1, hero2, ..., end]
  const bookWrap = document.getElementById('bookWrap');

  function buildPages() {
    // Cover
    const coverPage = document.createElement('div');
    coverPage.className = 'page';
    coverPage.dataset.index = '0';
    coverPage.innerHTML = `
      <div class="face face-front cover-face">
        <img class="cover-logo" src="images/ndlea-logo.png" alt="NDLEA Logo"
             onerror="this.style.display='none'">
        <div class="cover-title">NDLEA<br>Fallen Heroes</div>
        <div class="cover-divider"></div>
        <div class="cover-sub">In Memoriam</div>
        <div class="cover-tagline">
          "They gave their lives so others may<br>live free from the scourge of drugs."
        </div>
        <div class="cover-hint">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="white"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
          Tap to begin
        </div>
      </div>
      <div class="face face-back hero-face" style="justify-content:center;align-items:center;">
        <span style="color:rgba(255,255,255,0.15);font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;">Turn back</span>
      </div>`;
    bookWrap.appendChild(coverPage);

    // Hero pages
    heroes.forEach((hero, i) => {
      const pg = document.createElement('div');
      pg.className = 'page';
      pg.dataset.index = String(i + 1);

      const imgSrc = heroPhotoSrc(hero.serial);

      pg.innerHTML = `
        <div class="face face-front hero-face">
          <div class="hero-ribbon">
            <span class="ribbon-badge">NDLEA &mdash; Fallen Hero</span>
            <span class="ribbon-serial">#${String(i + 1).padStart(3,'0')}</span>
          </div>
          <div class="hero-photo-wrap">
            <div class="hero-photo-frame">
              <img src="${imgSrc}" alt="${hero.name}"
                   onerror="this.src='images/placeholder.jpg'">
            </div>
          </div>
          <div class="hero-info">
            <div class="hero-name">${hero.name}</div>
            <div class="hero-service-no">${hero.serviceNo}</div>
            <div class="hero-divider"></div>
            <div class="hero-detail-grid">
              <div class="detail-row">
                <span class="detail-label">Date of Death</span>
                <span class="detail-value">${hero.dateOfDeath}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Place of Death</span>
                <span class="detail-value">${hero.placeOfDeath}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Cause of Death</span>
                <span class="detail-value">${hero.causeOfDeath}</span>
              </div>
            </div>
          </div>
          <div class="hero-footer">
            ${makeFlamePair()}
            <div class="hero-rip">Rest In Peace</div>
          </div>
        </div>
        <div class="face face-back hero-face" style="justify-content:center;align-items:center;">
          <span style="color:rgba(255,255,255,0.15);font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;">Turn back</span>
        </div>`;
      bookWrap.appendChild(pg);
    });

    // End page
    const endPage = document.createElement('div');
    endPage.className = 'page';
    endPage.dataset.index = String(heroes.length + 1);
    endPage.innerHTML = `
      <div class="face face-front end-face">
        <div class="end-icon">🕯️</div>
        <div class="end-title">Their sacrifice<br>is not forgotten</div>
        <div class="hero-divider" style="width:50%;margin:0 auto;"></div>
        <div class="end-text">
          Every name on these pages belongs to a<br>
          brave officer who stood firm against<br>
          the menace of illicit drugs in Nigeria.<br><br>
          May they rest in eternal peace.
        </div>
        ${makeFlamePair()}
      </div>
      <div class="face face-back end-face">
        <span style="color:rgba(255,255,255,0.15);font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;">Turn back</span>
      </div>`;
    bookWrap.appendChild(endPage);
  }

  // ── Flip engine ────────────────────────────────────────────────
  buildPages();

  const pages = Array.from(bookWrap.querySelectorAll('.page'));
  const total  = pages.length;   // cover + heroes + end
  let current  = 0;              // which page is "active" (shown face-front)

  const btnPrev    = document.getElementById('btnPrev');
  const btnNext    = document.getElementById('btnNext');
  const pageCounter = document.getElementById('pageCounter');

  function updateUI() {
    pageCounter.textContent = `${current + 1} / ${total}`;
    btnPrev.disabled = current === 0;
    btnNext.disabled = current === total - 1;

    pages.forEach((pg, i) => {
      pg.classList.remove('active');
      // Pages before current are flipped and hidden behind
      if (i < current) {
        pg.classList.add('flipped');
        pg.style.zIndex = i;
      } else if (i === current) {
        pg.classList.remove('flipped');
        pg.classList.add('active');
        pg.style.zIndex = total + 1;
      } else {
        pg.classList.remove('flipped');
        pg.style.zIndex = total - i;
      }
    });
  }

  function goNext() {
    if (current >= total - 1) return;
    // Flip the current page away
    pages[current].classList.add('flipped');
    pages[current].style.zIndex = current;
    current++;
    pages[current].classList.add('active');
    pages[current].style.zIndex = total + 1;
    updateUI();
  }

  function goPrev() {
    if (current === 0) return;
    current--;
    pages[current].classList.remove('flipped');
    pages[current].classList.add('active');
    pages[current].style.zIndex = total + 1;
    updateUI();
  }

  btnNext.addEventListener('click', goNext);
  btnPrev.addEventListener('click', goPrev);

  // Tap on page face to advance
  bookWrap.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-btn')) goNext();
  });

  // ── Swipe support ──────────────────────────────────────────────
  let touchStartX = 0;
  bookWrap.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  bookWrap.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) goNext();
    else         goPrev();
  }, { passive: true });

  // ── Init ───────────────────────────────────────────────────────
  updateUI();
</script>
